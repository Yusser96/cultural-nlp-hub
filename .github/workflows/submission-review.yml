# Handles incoming submissions (new datasets and additional annotations):
#  1. Runs the automatic verification (.github/scripts/check_submission.py):
#     - new dataset  -> duplicate check by name / paper title / paper link
#     - annotation   -> dataset must exist, alias must be free on it
#     and posts the result as a comment.
#  2. (Optional) Sends a direct email to the maintainer inbox — enable by
#     setting the MAIL_* secrets and the MAIL_ENABLED=true repo variable.
#     Without them, rely on GitHub's built-in notifications: maintainers who
#     "Watch → Custom → Issues" the repo get an email for each submission.
name: Dataset submission review

on:
  issues:
    types: [opened]

permissions:
  issues: write
  contents: read

jobs:
  verify:
    if: >
      contains(github.event.issue.labels.*.name, 'dataset-submission') ||
      contains(github.event.issue.labels.*.name, 'annotation-submission')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run automatic checks
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          CHECK_MODE: ${{ contains(github.event.issue.labels.*.name, 'annotation-submission') && 'annotation' || 'dataset' }}
        run: python3 .github/scripts/check_submission.py > check_result.md

      - name: Post check result and review steps
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            cat check_result.md
            echo ""
            echo "---"
            echo "*What happens next: a maintainer reviews this against the coding manual"
            echo "(usually within two weeks) and may ask follow-up questions here. Accepted"
            echo "entries appear on the hub with the next data build, and this issue is"
            echo "closed with a link.*"
          } > comment.md
          gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body-file comment.md

  notify-maintainers:
    if: >
      contains(github.event.issue.labels.*.name, 'dataset-submission') ||
      contains(github.event.issue.labels.*.name, 'annotation-submission')
    runs-on: ubuntu-latest
    steps:
      - name: Email maintainers
        # Only runs when configured (Settings → Secrets and variables):
        #   variable MAIL_ENABLED=true; secrets MAIL_SERVER, MAIL_PORT,
        #   MAIL_USERNAME, MAIL_PASSWORD, MAIL_TO
        if: ${{ vars.MAIL_ENABLED == 'true' }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.MAIL_SERVER }}
          server_port: ${{ secrets.MAIL_PORT }}
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          to: ${{ secrets.MAIL_TO }}
          from: Cultural-NLP Hub <${{ secrets.MAIL_USERNAME }}>
          subject: "[Hub submission] ${{ github.event.issue.title }}"
          body: |
            New submission on the Cultural-NLP Dataset Hub:

            ${{ github.event.issue.title }}
            ${{ github.event.issue.html_url }}

            The automatic check result is posted as a comment on the issue.
