name: Add an annotation to an existing dataset
description: Add your own independent annotation to a dataset already in the hub. Easiest entry point — the "+ annotate" link next to the dataset, which prefills this form.
title: "[Annotation] "
labels: ["annotation-submission", "needs-review"]
body:
  - type: markdown
    attributes:
      value: |
        Your annotation is added **next to** the existing ones — it never replaces them. One annotation per name/alias per dataset: if your alias already appears on this dataset, comment on your original submission to update it instead. An automatic check verifies the dataset exists and your alias is free; a maintainer then reviews the annotation before it is published.

  - type: input
    id: annotator
    attributes:
      label: Annotator name or alias
      description: Shown publicly next to your annotation. Use your name or a stable alias.
    validations:
      required: true

  - type: input
    id: dataset
    attributes:
      label: Dataset name (as shown in the hub)
    validations:
      required: true

  - type: input
    id: paper-title
    attributes:
      label: Paper title (as shown in the hub)

  - type: dropdown
    id: branch-categories
    attributes:
      label: Branch :: category pairs
      description: Select every pair that applies.
      multiple: true
      options:
        - "Ideational :: Knowledge"
        - "Ideational :: Concepts"
        - "Ideational :: Values - general"
        - "Ideational :: Values - bias"
        - "Ideational :: Values - hate"
        - "Ideational :: Values - other perceptions"
        - "Ideational :: Norms and Morals"
        - "Ideational :: Artifacts"
        - "Ideational :: Demographics"
        - "Ideational :: Relationship"
        - "Ideational :: Communicative Goals"
        - "Ideational :: Context"
        - "Ideational :: Dialects"
        - "Ideational :: Styles, Registers, Genres"
        - "Linguistic :: Knowledge"
        - "Linguistic :: Concepts"
        - "Linguistic :: Values - general"
        - "Linguistic :: Values - bias"
        - "Linguistic :: Values - hate"
        - "Linguistic :: Values - other perceptions"
        - "Linguistic :: Norms and Morals"
        - "Linguistic :: Artifacts"
        - "Linguistic :: Demographics"
        - "Linguistic :: Relationship"
        - "Linguistic :: Communicative Goals"
        - "Linguistic :: Context"
        - "Linguistic :: Dialects"
        - "Linguistic :: Styles, Registers, Genres"
        - "Social :: Knowledge"
        - "Social :: Concepts"
        - "Social :: Values - general"
        - "Social :: Values - bias"
        - "Social :: Values - hate"
        - "Social :: Values - other perceptions"
        - "Social :: Norms and Morals"
        - "Social :: Artifacts"
        - "Social :: Demographics"
        - "Social :: Relationship"
        - "Social :: Communicative Goals"
        - "Social :: Context"
        - "Social :: Dialects"
        - "Social :: Styles, Registers, Genres"

  - type: dropdown
    id: rep-mode
    attributes:
      label: Representational mode
      description: "Apply the translation test: does a faithful translation leave the gold answer unchanged (C), changed (CL), or undefined (L)?"
      options:
        - C — culture-isolating (answer survives translation)
        - CL — culture–language entangled (answer altered by translation)
        - L — linguistic form only (answer undefined under translation)
        - Unsure — let a maintainer decide

  - type: checkboxes
    id: protocol-flags
    attributes:
      label: Evaluation-protocol dimensions the paper covers
      options:
        - label: Refusal (measures whether models decline when appropriate)
        - label: Agentic (evaluates models in an agentic / tool-use setting)
        - label: Safety (evaluates cultural safety / harm)
        - label: Robustness (tests paraphrase / perturbation stability)

  - type: textarea
    id: notes
    attributes:
      label: Notes for the reviewer
      description: Your reasoning, especially where you disagree with existing annotations.
