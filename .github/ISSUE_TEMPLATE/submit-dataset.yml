name: Submit a NEW cultural-NLP dataset
description: Propose a dataset that is not in the hub yet. To add your annotation to an existing dataset, use the "+ annotate" link next to it on the hub instead.
title: "[New dataset] "
labels: ["dataset-submission", "needs-review"]
body:
  - type: markdown
    attributes:
      value: |
        **This form is for datasets not yet in the hub.** Please [search the hub](https://yusser96.github.io/cultural-nlp-hub/) first — if the dataset is already there, use the **+ annotate** link next to it instead. An automatic check compares your submission against the catalog by name, title, and link, and a maintainer reviews every submission before it is published. Field definitions are in the [coding manual](../blob/main/README.md#annotation-schema).

  - type: input
    id: annotator
    attributes:
      label: Annotator name or alias
      description: Shown publicly next to your annotation. Use your name or a stable alias.
    validations:
      required: true

  - type: input
    id: dataset
    attributes:
      label: Dataset name
      placeholder: e.g. BLEnD
    validations:
      required: true

  - type: input
    id: title
    attributes:
      label: Paper title
    validations:
      required: true

  - type: input
    id: paper-link
    attributes:
      label: Paper link
      placeholder: https://aclanthology.org/...
    validations:
      required: true

  - type: input
    id: data-link
    attributes:
      label: Data link (repository, HuggingFace, download page)

  - type: input
    id: year
    attributes:
      label: Year of publication
      placeholder: "2026"

  - type: input
    id: languages
    attributes:
      label: Languages
      description: Comma-separated (e.g. English, Spanish, German).
    validations:
      required: true

  - type: input
    id: regions
    attributes:
      label: Cultural regions covered
      description: Comma-separated (e.g. East Asia, Latin America, Global).

  - type: dropdown
    id: branch-categories
    attributes:
      label: "Branch :: category pairs"
      description: Select every pair that applies.
      multiple: true
      options:
        - "Ideational :: Knowledge"
        - "Ideational :: Concepts"
        - "Ideational :: Values - general"
        - "Ideational :: Values - bias"
        - "Ideational :: Values - hate"
        - "Ideational :: Values - other perceptions"
        - "Ideational :: Norms and Morals"
        - "Ideational :: Artifacts"
        - "Ideational :: Demographics"
        - "Ideational :: Relationship"
        - "Ideational :: Communicative Goals"
        - "Ideational :: Context"
        - "Ideational :: Dialects"
        - "Ideational :: Styles, Registers, Genres"
        - "Linguistic :: Knowledge"
        - "Linguistic :: Concepts"
        - "Linguistic :: Values - general"
        - "Linguistic :: Values - bias"
        - "Linguistic :: Values - hate"
        - "Linguistic :: Values - other perceptions"
        - "Linguistic :: Norms and Morals"
        - "Linguistic :: Artifacts"
        - "Linguistic :: Demographics"
        - "Linguistic :: Relationship"
        - "Linguistic :: Communicative Goals"
        - "Linguistic :: Context"
        - "Linguistic :: Dialects"
        - "Linguistic :: Styles, Registers, Genres"
        - "Social :: Knowledge"
        - "Social :: Concepts"
        - "Social :: Values - general"
        - "Social :: Values - bias"
        - "Social :: Values - hate"
        - "Social :: Values - other perceptions"
        - "Social :: Norms and Morals"
        - "Social :: Artifacts"
        - "Social :: Demographics"
        - "Social :: Relationship"
        - "Social :: Communicative Goals"
        - "Social :: Context"
        - "Social :: Dialects"
        - "Social :: Styles, Registers, Genres"

  - type: dropdown
    id: rep-mode
    attributes:
      label: Representational mode
      description: "Apply the translation test: does a faithful translation leave the gold answer unchanged (C), changed (CL), or undefined (L)?"
      options:
        - C — culture-isolating (answer survives translation)
        - CL — culture–language entangled (answer altered by translation)
        - L — linguistic form only (answer undefined under translation)
        - Unsure — let a maintainer decide

  - type: input
    id: models
    attributes:
      label: Models evaluated in the paper (if any)
      description: Semicolon-separated (e.g. GPT-4; Llama-3-8B-Instruct; mBERT).

  - type: checkboxes
    id: protocol-flags
    attributes:
      label: Evaluation-protocol dimensions the paper covers
      options:
        - label: Refusal (measures whether models decline when appropriate)
        - label: Agentic (evaluates models in an agentic / tool-use setting)
        - label: Safety (evaluates cultural safety / harm)
        - label: Robustness (tests paraphrase / perturbation stability)

  - type: textarea
    id: example
    attributes:
      label: One representative example item
      description: A single item from the dataset that shows what it measures.

  - type: textarea
    id: notes
    attributes:
      label: Notes for the reviewer
      description: Anything that helped you decide the mode/categories, or open questions.

  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmation
      options:
        - label: This dataset is publicly documented (published paper or public repository), and I searched the hub to confirm it is not already listed.
          required: true
